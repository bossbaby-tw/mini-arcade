<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Slide · Mini Puzzle</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f5f1e8;color:#253f37;font:16px system-ui;display:grid;place-items:center;padding:24px}main{width:min(100%,410px)}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;font-weight:700}header span:last-child{background:#e5e9dc;padding:8px 12px;border-radius:20px}h1{font-size:54px;letter-spacing:-3px;margin:34px 0 8px;font-weight:750}p{color:#6a7870;line-height:1.6;margin:0 0 26px}.stats{display:flex;justify-content:space-between;font-size:12px;margin-bottom:16px}.stats strong{font-size:18px;margin-left:6px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#dce3d5;border:1px solid #ced7c8;padding:12px;border-radius:24px;box-shadow:0 16px 32px #294a3010}.tile{aspect-ratio:1;border:0;border-radius:15px;background:#fffdf6;color:#2b4b3a;font:600 38px system-ui;cursor:pointer;box-shadow:0 4px 0 #c7cfbd;transition:transform .12s,background .15s}.tile:hover:not(:disabled){transform:translateY(-3px);background:#f6ffde}.tile:focus-visible{outline:3px solid #ed995e;outline-offset:2px}.tile:disabled{cursor:default}.empty{background:transparent;box-shadow:none}.correct{color:#477543;background:#edf4df}.actions{display:flex;gap:10px;margin:22px 0 14px}.actions button{flex:1;border:1px solid #c8d2c1;border-radius:12px;padding:14px;background:transparent;color:#365540;font:600 14px system-ui;cursor:pointer}.actions button:first-child{background:#304e3c;color:#fff;border-color:#304e3c}.actions button:hover{filter:brightness(1.1)}#message{min-height:44px;text-align:center;font-size:13px;color:#62745f;margin:16px 0}footer{text-align:center;border-top:1px solid #dce1d5;padding-top:20px;color:#899180;font-size:10px;letter-spacing:2px}button{touch-action:manipulation}@media(max-width:420px){h1{font-size:46px;margin-top:26px}.tile{font-size:30px}}</style><main><header><span>✳ LITTLE GAMES</span><span>NO. 002</span></header><h1>Little slide.</h1><p>A tiny puzzle for a little pause.<br>Slide the tiles into order, from 1 to 8.</p><div class="stats"><span>MOVES <strong id="moves">0</strong></span><span>TIME <strong id="time">0:00</strong></span></div><div class="board" id="board" aria-label="Sliding puzzle"></div><div class="actions"><button id="shuffle">↻ New puzzle</button><button id="undo">← Undo</button></div><div id="message" role="status" aria-live="polite">Tap a tile next to the empty space.</div><footer>SMALL CHALLENGE. SATISFYING FINISH.</footer></main><script>
let tiles=[],moves=0,history=[],started=0,elapsed=0,won=false;const board=document.querySelector('#board');const near=(a,b)=>Math.abs(Math.floor(a/3)-Math.floor(b/3))+Math.abs(a%3-b%3)===1;const solved=()=>tiles.every((v,i)=>v===(i+1)%9);function render(){board.replaceChildren();tiles.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(!v?' empty':v===i+1?' correct':'');b.textContent=v||'';b.disabled=!v||won;b.setAttribute('aria-label',v?'Slide tile '+v:'Empty space');b.onclick=()=>move(i);board.append(b)});document.querySelector('#moves').textContent=moves;document.querySelector('#undo').disabled=!history.length}function move(i){let j=tiles.indexOf(0);if(won||!near(i,j))return;if(!started)started=Date.now();history.push([...tiles]);[tiles[i],tiles[j]]=[tiles[j],tiles[i]];moves++;won=solved();if(won){elapsed=Date.now()-started;document.querySelector('#message').textContent='✦ Beautifully done! Solved in '+moves+' moves.'}render()}function shuffle(){tiles=[1,2,3,4,5,6,7,8,0];let previous=-1;for(let k=0;k<18;k++){let j=tiles.indexOf(0),opts=tiles.map((_,i)=>i).filter(i=>near(i,j)&&i!==previous),i=opts[Math.floor(Math.random()*opts.length)];[tiles[i],tiles[j]]=[tiles[j],tiles[i]];previous=j}if(solved()){[tiles[7],tiles[8]]=[tiles[8],tiles[7]]}moves=0;history=[];started=0;elapsed=0;won=false;document.querySelector('#message').textContent='Tap a tile next to the empty space.';document.querySelector('#time').textContent='0:00';render()}document.querySelector('#shuffle').onclick=shuffle;document.querySelector('#undo').onclick=()=>{if(!history.length)return;tiles=history.pop();moves--;won=false;document.querySelector('#message').textContent='Tap a tile next to the empty space.';render()};setInterval(()=>{let s=Math.floor((won?elapsed:started?Date.now()-started:0)/1000);document.querySelector('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250);shuffle();
</script></html>
